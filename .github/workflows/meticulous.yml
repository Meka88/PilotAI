name: Meticulous

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  actions: write
  contents: read
  statuses: write

jobs:
  test:
    name: Meticulous
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          NODE_ENV: production
          CI: false

      - name: Upload assets and run Meticulous tests
        uses: alwaysmeticulous/report-diffs-action/upload-assets@v1
        with:
          api-token: ${{ secrets.METICULOUS_API_TOKEN }}
          app-directory: dist
          rewrites: |
            [
              { "source": "/(.*)", "destination": "/index.html" }
            ]
